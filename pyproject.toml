[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rttdist"
version = "0.1.0"
description = "Bootstrap scaffold for round-trip translation distance experiments."
requires-python = ">=3.14"
dependencies = [
    "PyYAML==6.0.3",
    "apted==1.0.3",
    "psutil==7.2.2",
    "pytest==8.4.2",
    "tree-sitter==0.26.0",
    "tree-sitter-cpp==0.23.4",
]

[project.scripts]
rttdist = "rttdist.cli:main"

[project.optional-dependencies]
analysis = [
    "numpy==2.5.3",
    "matplotlib==3.10.8",
    "python-docx==1.2.0",
    "pymupdf==1.28.2",
]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
