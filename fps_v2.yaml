  api_key_env: CMD_API_KEY
  generation:
    temperature: 0.6
    top_p: 0.95
    # 32 probe calls (2026-09-19, reasoning_effort low): completion max 881, p90 452,
    # reasoning max 56, all finish=stop. 16384 leaves >18x headroom for reasoning spikes
    # (without effort low a single call exceeded 4096 on reasoning alone).
    max_tokens: 16384
    seed: 20260919
    # thinking:{type:disabled} is largely ignored by the gateway (probe 2026-09-19);
    # reasoning_effort: low brings reasoning tokens to ~0 on translation prompts.
    reasoning_effort: low
