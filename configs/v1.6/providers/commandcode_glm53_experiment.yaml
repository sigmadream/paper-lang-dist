# 본 실험 전용입니다. 기존 연동 점검 응답을 재사용하지 않습니다.
provider: compatible
protocol: chat_completions
base_url: https://api.commandcode.ai/provider/v1
request_path: /chat/completions
auth:
  type: bearer
  api_key_env: CMD_API_KEY
model: zai-org/GLM-5.3
allowed_response_models: []
generation_profile:
  name: commandcode-glm53-v16-low-16384
  supported_options:
  - temperature
  - top_p
  - max_tokens
  - reasoning_effort
  option_values:
    reasoning_effort:
    - low
generation:
  temperature: 0.6
  top_p: 0.95
  max_tokens: 16384
  reasoning_effort: low
request_timeout: 180
retries: 2
max_calls: 3600
max_transport_attempts: 10800
cost_cap_usd: 50
max_request_cost_usd: 0.25
max_input_tokens: 32768
pricing:
  input_per_million: 1.4
  output_per_million: 4.4
  cached_input_per_million: 0.26
