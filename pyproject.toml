[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rttdist"
version = "0.1.0"
description = "Bootstrap scaffold for round-trip translation distance experiments."
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.3",
    "lizard==1.21.2",
    "pytest==8.4.2",
]

[project.scripts]
rttdist = "rttdist.cli:main"

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
