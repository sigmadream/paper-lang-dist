# Flash 전용 설정이며 피크 상계 단가를 사용합니다.
# temperature는 추론 모드 미지원, top_p는 지원되나 기존 조건 유지로 생략합니다.
# seed는 추가하지 않으며 미보고 실효 설정은 null로 유지합니다.
provider: compatible
protocol: chat_completions
base_url: https://api.commandcode.ai/provider/v1
request_path: /chat/completions
auth:
  type: bearer
  api_key_env: CMD_API_KEY
model: deepseek/deepseek-v4.1-flash
allowed_response_models: []
generation_profile:
  name: commandcode-ds41-flash-v16-low-16384
  supported_options:
  - max_tokens
  - reasoning_effort
  option_values:
    reasoning_effort:
    - low
generation:
  max_tokens: 16384
  reasoning_effort: low
request_timeout: 180
retries: 2
max_calls: 3600
max_transport_attempts: 10800
cost_cap_usd: 48.62
max_request_cost_usd: 0.25
max_input_tokens: 32768
pricing:
  input_per_million: 0.3
  output_per_million: 1.2
  cached_input_per_million: 0.006
