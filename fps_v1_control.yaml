# Control C1: same-language rewrite (cpp -> cpp -> cpp).
# Purpose: separate "the model rewrites code while translating" from "the two
# languages are far apart". compare with the cpp-via-<L> routes in fps_v2.yaml.
#
# python scripts/validate_fps_corpus.py fps_v2_control.yaml
# python -m rttdist fps --config fps_v2_control.yaml --phase pilot --action run
# python -m rttdist fps --config fps_v2_control.yaml --phase main --action run

experiment_version: fps-text-v1

