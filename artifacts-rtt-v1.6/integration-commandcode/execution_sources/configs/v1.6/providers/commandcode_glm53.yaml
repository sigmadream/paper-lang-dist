# 실제 연동 점검 전용입니다. 본 실험에 그대로 재사용하지 마십시오.
# https://commandcode.ai/docs/provider
# https://commandcode.ai/docs/reference/cli/models
provider: compatible
protocol: chat_completions
base_url: https://api.commandcode.ai/provider/v1
request_path: /chat/completions
auth:
  type: bearer
  api_key_env: CMD_API_KEY
model: zai-org/GLM-5.3
# 공식 Z.AI 모델 ID에 한정한 명시적 별칭입니다.
allowed_response_models: [GLM-5.3, glm-5.3]
generation_profile:
  name: commandcode-glm53-integration-smoke
  supported_options: [max_tokens, reasoning_effort]
  option_values:
    reasoning_effort: [low]
generation:
  max_tokens: 4096
  reasoning_effort: low
request_timeout: 180
retries: 0
max_calls: 6
max_transport_attempts: 6
cost_cap_usd: 1.0
max_request_cost_usd: 0.15
max_input_tokens: 16384
pricing:
  input_per_million: 1.40
  output_per_million: 4.40
  cached_input_per_million: 0.26
